[package]
name = "texcopy"
version = "0.1.0"
edition = "2024"
description = "Select LaTeX-rendered math on screen and get its LaTeX source on your clipboard"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
image = "0.25.10"
ort = "2.0.0-rc.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = "0.23.2"
ureq = "3.4.2"
xcap = { version = "0.9.8", optional = true }

[profile.release]
strip = true
lto = "thin"

[features]
default = ["capture"]
# Screen capture (--screen/--region). Needs pipewire/dbus/X11 dev packages to build on Linux.
capture = ["dep:xcap"]
