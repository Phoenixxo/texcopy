[package]
name = "texcopy"
version = "0.1.0"
edition = "2024"
description = "Select LaTeX-rendered math on screen and get its LaTeX source on your clipboard"
license = "MIT"
# egui needs 1.95 and CI checks it.
rust-version = "1.95"
repository = "https://github.com/Phoenixxo/texcopy"
homepage = "https://github.com/Phoenixxo/texcopy"
readme = "README.md"
keywords = ["latex", "ocr", "math", "screenshot", "clipboard"]
categories = ["command-line-utilities", "multimedia::images"]
# keep the crate small, the window still needs packaging/icon/icon-256.png.
exclude = [
    ".github/",
    "tools/",
    "packaging/linux/",
    "packaging/macos/",
    "packaging/windows/",
    "packaging/icon/make_icon.py",
    "packaging/icon/icon-1024.png",
]

# texcopy is the command line, texcopy-gui is the same thing without a console on windows.
[[bin]]
name = "texcopy-gui"
path = "src/bin/texcopy-gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
eframe = { version = "0.36.2", optional = true }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
ort = "2.0.0-rc.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }
ureq = "3.4.2"
xcap = { version = "0.9.8", optional = true }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
# fat lto, about 2 MB smaller than thin but it builds slower.
lto = "fat"
# no unwinding, saves about 0.8 MB since we never catch panics.
panic = "abort"

[features]
default = ["capture", "gui"]
# screen capture, needs pipewire, dbus and X11 dev packages on linux.
capture = ["dep:xcap"]
# the window. without it you get a smaller command line only build.
gui = ["dep:eframe"]
