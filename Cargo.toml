[package]
name = "texcopy"
version = "0.1.0"
edition = "2024"
description = "Select LaTeX-rendered math on screen and get its LaTeX source on your clipboard"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
image = "0.25.10"
ort = "2.0.0-rc.13"
tokenizers = "0.23.2"
ureq = "3.4.2"

[profile.release]
strip = true
lto = "thin"
