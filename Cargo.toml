[package]
name = "texcopy"
version = "0.1.0"
edition = "2024"
description = "Select LaTeX-rendered math on screen and get its LaTeX source on your clipboard"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
ort = "2.0.0-rc.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }
ureq = "3.4.2"
xcap = { version = "0.9.8", optional = true }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
# Whole-program optimization across all crates: ~2 MB smaller than "thin" at the cost of a slower build.
lto = "fat"
# No unwinding machinery (~0.8 MB). texcopy never catches panics.
panic = "abort"

[features]
default = ["capture"]
# Screen capture (--screen/--region). Needs pipewire/dbus/X11 dev packages to build on Linux.
capture = ["dep:xcap"]
