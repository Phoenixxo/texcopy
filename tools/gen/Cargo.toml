[package]
name = "texcopy-gen"
version = "0.0.0"
edition = "2024"
publish = false
description = "Makes benchmark cases for texcopy: pictures of LaTeX with their exact source. A dev tool, not shipped."

# standalone so it never touches the program's dependencies or builds.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
