name: Feature request
description: Suggest something texcopy could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution. An example screenshot helps.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like texcopy to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
