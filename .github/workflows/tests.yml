name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; Intel Macs are not a supported target.
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # a new prefix starts clean caches that include the ONNX Runtime download
          prefix-key: v1-rust
          # ort-sys downloads ONNX Runtime outside target/; a restored target/ expects it to still be there
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
      - run: cargo test --locked

  # The command-line-only build (no window, no screen capture) must keep passing without the
  # capture libraries installed.
  headless:
    name: ubuntu (command line only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # a new prefix starts clean caches that include the ONNX Runtime download
          prefix-key: v1-rust
          # ort-sys downloads ONNX Runtime outside target/; a restored target/ expects it to still be there
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
      - run: cargo test --locked --no-default-features

  # The benchmark's case generator (tools/gen) is its own small crate.
  generator:
    name: ubuntu (benchmark generator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gen
      - run: cargo test --locked --manifest-path tools/gen/Cargo.toml
