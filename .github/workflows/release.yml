name: Release

# Push a tag like v0.1.0 (it must match `version` in Cargo.toml) to build all three platforms and
# publish a GitHub release with the downloads and their SHA-256 checksums. "Run workflow" on the
# Actions page builds the same files as downloadable artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon; Intel Macs are not a supported target.
          - { os: macos-14, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
          # An older Ubuntu keeps the binary usable on older distributions (it links the system glibc).
          - { os: ubuntu-22.04, name: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"; exit 1; }
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/make-app.sh target/release/texcopy dist
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/make-tarball.sh target/release/texcopy dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: powershell -File packaging/windows/make-zip.ps1 -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: texcopy-${{ matrix.name }}
          # the macOS job also leaves the unzipped .app in dist/, which is not a download
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
