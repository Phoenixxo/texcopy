name: CI
# lint and format on linux, build and package on every platform.

on:
  push:
    branches: [main]
  pull_request:

# cancel the old run when a newer push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # lint doesn't care about the OS so it only runs on linux.
  lint:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies (screen capture and the window)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/gen
          prefix-key: v1-rust
          cache-directories: |
            ~/.cache/ort.pyke.io
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path tools/gen/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path tools/gen/Cargo.toml -- -D warnings

  # build the release binary and package it on every platform.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is apple silicon.
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies (screen capture and the window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # new prefix, throws away the old caches.
          prefix-key: v1-rust
          # bring in ONNX runtime from outside of target.
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
      - name: Build release
        run: cargo build --locked --release
      # run the packaging scripts everywhere so a broken one shows up before a release.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/make-app.sh target/release/texcopy dist
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/make-tarball.sh target/release/texcopy dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: powershell -File packaging/windows/make-zip.ps1 -Out dist

  # the oldest rust we say works (rust-version in Cargo.toml) has to build.
  msrv:
    name: rust 1.95 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # new prefix, throws away the old caches.
          prefix-key: v1-rust
          # bring in ONNX runtime from outside of target.
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
      - run: cargo check --locked

  # the command line build has to work without the capture libraries.
  headless:
    name: ubuntu (no capture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # new prefix, throws away the old caches.
          prefix-key: v1-rust
          # bring in ONNX runtime from outside of target.
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
      - run: cargo build --locked --release --no-default-features
