name: CI
# Format and lint (Linux only), then build and package on every platform.
# The tests have their own workflow (tests.yml) and badge.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lint don't depend on the OS, so they run once, on Linux.
  lint:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies (screen capture and the window)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/gen
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path tools/gen/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path tools/gen/Cargo.toml -- -D warnings

  # Build the release binary and run the packaging script on every platform.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; Intel Macs are not a supported target.
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies (screen capture and the window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --locked --release
      # The packaging scripts run on every platform so a broken one is found before a release.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/make-app.sh target/release/texcopy dist
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/make-tarball.sh target/release/texcopy dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: powershell -File packaging/windows/make-zip.ps1 -Out dist

  # The oldest Rust we promise (rust-version in Cargo.toml) must still build the program.
  msrv:
    name: rust 1.95 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  # The CLI-only build must keep working on a machine without the capture libraries.
  headless:
    name: ubuntu (no capture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --no-default-features
